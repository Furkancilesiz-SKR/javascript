<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanal Kabin Lite - AR</title>
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-face-aframe.prod.js"></script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
        }
        #kamera-alani {
            flex: 3;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            position: relative; /* A-Frame'in düzgün yerleşmesi için */
        }
        #menu-alani {
            flex: 1;
            height: 100vh;
            background-color: #2c2c2c;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .buton {
            padding: 15px;
            background-color: #4a4a4a;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        .buton:hover {
            background-color: #ff3b3b;
        }
    </style>
</head>
<body>

    <div id="kamera-alani">
        <a-scene mindar-face embedded color-space="sRGB" 
                 vr-mode-ui="enabled: false" 
                 device-orientation-permission-ui="enabled: false"
                 style="width: 100%; height: 100%;">
            <a-camera active="false" position="0 0 0"></a-camera>
            <a-entity mindar-face-target="anchorIndex: 1">
                <a-gltf-model id="ar-model" src="" 
                              position="0 0 0" rotation="0 0 0" scale="1 1 1">
                </a-gltf-model>
            </a-entity>
        </a-scene>
    </div>

    <div id="menu-alani">
        <h2>Seçimini Yap</h2>
        <button class="buton" onclick="temaSec('kovboy')">🤠 Kovboy Teması</button>
        <button class="buton" onclick="temaSec('uzayli')">👽 Uzaylı Teması</button>
        <button class="buton" onclick="temaSec('kral')">👑 Kral Teması</button>
    </div>

    <script>
        // Mind-AR kendi kamerasını yönettiği için ayrı bir getUserMedia çağrısına gerek yok.

        function temaSec(tema) {
            const model = document.getElementById('ar-model');
            const modeller = {
                kovboy: {
                    src: './modeller/kovboy_sapkasi.glb',
                    position: '0 0.05 0',
                    rotation: '0 -10 0',
                    scale: '1.2 1.2 1.2'
                },
                uzayli: {
                    src: './modeller/uzayli_gozluk.glb',
                    position: '0 -0.02 -0.02',
                    rotation: '0 0 0',
                    scale: '0.9 0.9 0.9'
                },
                kral: {
                    src: './modeller/kral_taci.glb',
                    position: '0 0.08 0',
                    rotation: '0 0 0',
                    scale: '1 1 1'
                }
            };

            const ayar = modeller[tema];
            if (ayar) {
                model.setAttribute('src', ayar.src);
                model.setAttribute('position', ayar.position);
                model.setAttribute('rotation', ayar.rotation);
                model.setAttribute('scale', ayar.scale);
            }
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanal Kabin Lite</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
        }
        #kamera-alani {
            flex: 3;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Ayna efekti için videoyu ters çevirir */
        }
        #menu-alani {
            flex: 1;
            height: 100vh;
            background-color: #2c2c2c;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .buton {
            padding: 15px;
            background-color: #4a4a4a;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        .buton:hover {
            background-color: #ff3b3b;
        }
    </style>
</head>
<body>

    <div id="kamera-alani">
        <video id="webcam" autoplay playsinline></video>
    </div>

    <div id="menu-alani">
        <h2>Seçimini Yap</h2>
        <button class="buton" onclick="temaSec('kovboy')">🤠 Kovboy Teması</button>
        <button class="buton" onclick="temaSec('uzayli')">👽 Uzaylı Teması</button>
        <button class="buton" onclick="temaSec('kral')">👑 Kral Teması</button>
    </div>

    <script>
        // Kamerayı Başlatma Fonksiyonu
        async function kamerayiBaslat() {
            const video = document.getElementById('webcam');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
            } catch (hata) {
                console.error("Kameraya erişilemedi: ", hata);
                alert("Lütfen kamera izni verin!");
            }
        }

        // Butonlara tıklandığında çalışacak test fonksiyonu
        function temaSec(tema) {
            console.log("Seçilen tema: " + tema);
            // İleride AR objelerini buraya bağlayacağız
        }

        // Sayfa yüklendiğinde kamerayı aç
        window.onload = kamerayiBaslat;
    </script>

</body>
</html>

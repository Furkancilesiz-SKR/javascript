<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanal Kabin Kiosk Arayüzü</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="kiosk-ekrani">
        
        <video id="webcam" autoplay playsinline></video>

        <div id="adim-kiyafet" class="adim-katmani">
            <div class="baslik-alani">
                <h1>Sanal Kabin</h1>
                <p>Üzerinizde görmek istediğiniz stili seçin.</p>
            </div>
            
            <div class="secenek-grid">
                <div class="secenek-kart" onclick="secimYap('kiyafet', 'Kovboy', this)">🤠 Kovboy</div>
                <div class="secenek-kart" onclick="secimYap('kiyafet', 'Takım Elbise', this)">👔 Takım Elbise</div>
                <div class="secenek-kart" onclick="secimYap('kiyafet', 'Astronot', this)">🚀 Astronot</div>
                <div class="secenek-kart" onclick="secimYap('kiyafet', 'Siberpunk', this)">🤖 Siberpunk</div>
            </div>

            <button class="ileri-buton" onclick="sonrakiAdim('adim-kiyafet', 'adim-arkaplan')">İleri: Arka Plan Seç</button>
        </div>

        <div id="adim-arkaplan" class="adim-katmani gizli">
            <div class="baslik-alani">
                <h1>Atmosferi Belirle</h1>
                <p>Nerede olmak istersiniz?</p>
            </div>
            
            <div class="secenek-grid">
                <div class="secenek-kart" onclick="secimYap('arkaplan', 'Vahşi Batı', this)">🏜️ Vahşi Batı</div>
                <div class="secenek-kart" onclick="secimYap('arkaplan', 'Neon Şehir', this)">🌃 Neon Şehir</div>
                <div class="secenek-kart" onclick="secimYap('arkaplan', 'Mars', this)">🪐 Mars Yüzeyi</div>
                <div class="secenek-kart" onclick="secimYap('arkaplan', 'Kırmızı Halı', this)">📸 Kırmızı Halı</div>
            </div>

            <button class="ileri-buton" onclick="videoyuUret()">Sihri Başlat!</button>
        </div>

        <div id="adim-yukleniyor" class="adim-katmani gizli">
            <div class="yukleniyor-cember"></div>
            <h2>Deneyiminiz Oluşturuluyor...</h2>
            <p id="yukleme-metni">Yüz hatları analiz ediliyor...</p>
        </div>

        <div id="adim-sonuc" class="adim-katmani gizli" style="background: #000;">
            <video id="sonuc-video" loop playsinline src="https://www.w3schools.com/html/mov_bbb.mp4"></video>
            
            <div style="position: absolute; bottom: 30px; width: 100%; text-align: center; z-index: 25;">
                <button class="ileri-buton" style="width: 60%; background: #fff; color: #000;" onclick="basaDon()">Başa Dön</button>
            </div>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>

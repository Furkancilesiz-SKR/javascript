<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanal Kabin Kiosk Arayüzü</title>
    <style>
        /* Temel Kiosk Tasarımı (Dikey Ekran Hissiyatı) */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
            color: #fff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #kiosk-ekrani {
            width: 100%;
            max-width: 500px; /* Stand ekranı gibi dikey durması için sınırlandırdık */
            height: 100vh;
            position: relative;
            background-color: #111;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        /* Arka Plandaki Kamera Görüntüsü */
        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            transform: scaleX(-1); /* Ayna efekti */
        }

        /* Adımların Ortak Tasarımı */
        .adim-katmani {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.4); /* Kamerayı hafif karartır */
            backdrop-filter: blur(5px);
            transition: opacity 0.5s ease;
        }

        .gizli {
            display: none !important;
        }

        /* Başlıklar ve Metinler */
        .baslik-alani {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }

        h1 { margin: 0; font-size: 28px; font-weight: 600; }
        p { margin: 10px 0 0 0; font-size: 16px; color: #ddd; }

        /* Seçenek Izgarası (Grid) */
        .secenek-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 20px;
            margin-top: auto;
            margin-bottom: 50px;
        }

        .secenek-kart {
            background-color: rgba(255, 255, 255, 0.1);
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            font-size: 18px;
            font-weight: bold;
        }

        .secenek-kart:hover, .secenek-kart.secili {
            background-color: rgba(255, 255, 255, 0.2);
            border-color: #ff3b3b;
        }

        /* İleri/Onay Butonu */
        .ileri-buton {
            width: 80%;
            margin: 0 auto 40px auto;
            padding: 18px;
            background-color: #ff3b3b;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 59, 59, 0.4);
            transition: 0.3s;
        }

        .ileri-buton:hover { background-color: #ff1a1a; }

        /* Yükleme Ekranı Özel Tasarımı */
        #adim-yukleniyor {
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
        }

        .yukleniyor-cember {
            border: 6px solid #333;
            border-top: 6px solid #ff3b3b;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: don 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes don { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Sonuç Videosu Alanı */
        #sonuc-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 20;
        }
    </style>
</head>
<body>

    <div id="kiosk-ekrani">
        
        <video id="webcam" autoplay playsinline></video>

        <div id="adim-kiyafet" class="adim-katmani">
            <div class="baslik-alani">
                <h1>Sanal Kabin</h1>
                <p>Üzerinizde görmek istediğiniz stili seçin.</p>
            </div>
            
            <div class="secenek-grid">
                <div class="secenek-kart" onclick="secimYap('kiyafet', 'Kovboy', this)">🤠 Kovboy</div>
                <div class="secenek-kart" onclick="secimYap('kiyafet', 'Takım Elbise', this)">👔 Takım Elbise</div>
                <div class="secenek-kart" onclick="secimYap('kiyafet', 'Astronot', this)">🚀 Astronot</div>
                <div class="secenek-kart" onclick="secimYap('kiyafet', 'Siberpunk', this)">🤖 Siberpunk</div>
            </div>

            <button class="ileri-buton" onclick="sonrakiAdim('adim-kiyafet', 'adim-arkaplan')">İleri: Arka Plan Seç</button>
        </div>

        <div id="adim-arkaplan" class="adim-katmani gizli">
            <div class="baslik-alani">
                <h1>Atmosferi Belirle</h1>
                <p>Nerede olmak istersiniz?</p>
            </div>
            
            <div class="secenek-grid">
                <div class="secenek-kart" onclick="secimYap('arkaplan', 'Vahşi Batı', this)">🏜️ Vahşi Batı</div>
                <div class="secenek-kart" onclick="secimYap('arkaplan', 'Neon Şehir', this)">🌃 Neon Şehir</div>
                <div class="secenek-kart" onclick="secimYap('arkaplan', 'Mars', this)">🪐 Mars Yüzeyi</div>
                <div class="secenek-kart" onclick="secimYap('arkaplan', 'Kırmızı Halı', this)">📸 Kırmızı Halı</div>
            </div>

            <button class="ileri-buton" onclick="videoyuUret()">Sihri Başlat!</button>
        </div>

        <div id="adim-yukleniyor" class="adim-katmani gizli">
            <div class="yukleniyor-cember"></div>
            <h2>Deneyiminiz Oluşturuluyor...</h2>
            <p id="yukleme-metni">Yüz hatları analiz ediliyor...</p>
        </div>

        <div id="adim-sonuc" class="adim-katmani gizli" style="background: #000;">
            <video id="sonuc-video" loop playsinline src="https://www.w3schools.com/html/mov_bbb.mp4"></video>
            
            <div style="position: absolute; bottom: 30px; width: 100%; text-align: center; z-index: 25;">
                <button class="ileri-buton" style="width: 60%; background: #fff; color: #000;" onclick="basaDon()">Başa Dön</button>
            </div>
        </div>

    </div>

    <script>
        // Kullanıcı seçimlerini tutacağımız obje
        let kullaniciSecimleri = {
            kiyafet: "",
            arkaplan: ""
        };

        // 1. Kamerayı Başlat
        async function kamerayiBaslat() {
            const video = document.getElementById('webcam');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
            } catch (hata) {
                console.error("Kamera açılamadı:", hata);
            }
        }

        // 2. Seçim Yapma Fonksiyonu (Kartlara tıklanınca çalışır)
        function secimYap(kategori, secim, element) {
            kullaniciSecimleri[kategori] = secim;
            
            // Tıklanan kategorideki diğer kartların seçim rengini temizle
            let grid = element.parentElement;
            let kartlar = grid.getElementsByClassName('secenek-kart');
            for(let i=0; i<kartlar.length; i++) {
                kartlar[i].classList.remove('secili');
            }
            
            // Sadece tıklanan kartı seçili yap
            element.classList.add('secili');
        }

        // 3. Adımlar Arası Geçiş
        function sonrakiAdim(mevcutAdimId, sonrakiAdimId) {
            document.getElementById(mevcutAdimId).classList.add('gizli');
            document.getElementById(sonrakiAdimId).classList.remove('gizli');
        }

        // 4. Yapay Zeka Üretim Simülasyonu (Animasyonlu Yükleme)
        function videoyuUret() {
            // Seçim yapıldı mı kontrolü
            if(!kullaniciSecimleri.kiyafet || !kullaniciSecimleri.arkaplan) {
                alert("Lütfen önce kıyafet ve arka plan seçin!");
                return;
            }

            // Arka plan seçiminden yükleme ekranına geç
            sonrakiAdim('adim-arkaplan', 'adim-yukleniyor');

            let metin = document.getElementById('yukleme-metni');
            
            // Kullanıcıya yapay zeka çalışıyormuş hissi vermek için metinleri sırayla değiştiriyoruz
            setTimeout(() => { metin.innerText = kullaniciSecimleri.kiyafet + " kıyafeti giydiriliyor..."; }, 1500);
            setTimeout(() => { metin.innerText = kullaniciSecimleri.arkaplan + " arka planı ekleniyor..."; }, 3000);
            setTimeout(() => { metin.innerText = "Video işleniyor... Neredeyse hazır!"; }, 4500);

            // 6 Saniye sonra sonuç ekranını göster
            setTimeout(() => {
                sonrakiAdim('adim-yukleniyor', 'adim-sonuc');
                document.getElementById('sonuc-video').play();
            }, 6000);
        }

        // 5. Sistemi Sıfırla
        function basaDon() {
            document.getElementById('sonuc-video').pause();
            document.getElementById('sonuc-video').currentTime = 0;
            
            // Tüm seçimleri temizle
            kullaniciSecimleri = { kiyafet: "", arkaplan: "" };
            let kartlar = document.getElementsByClassName('secenek-kart');
            for(let i=0; i<kartlar.length; i++) { kartlar[i].classList.remove('secili'); }

            sonrakiAdim('adim-sonuc', 'adim-kiyafet');
        }

        // Sayfa yüklendiğinde kamerayı tetikle
        window.onload = kamerayiBaslat;
    </script>

</body>
</html>
